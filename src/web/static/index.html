<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driving Robot</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Meiryo UI', 'Meiryo', 'Yu Gothic UI', 'MS PGothic', sans-serif;
      background: #ece9e2;
      color: #1f1f1f;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    #root { display: flex; flex-direction: column; }

    /* Toast notification */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #1f1f1f;
      color: #fafaf7;
      padding: 10px 18px;
      border-radius: 6px;
      font-family: 'Meiryo UI', 'Meiryo', 'Yu Gothic UI', sans-serif;
      font-size: 15px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
      animation: slideIn 0.2s ease;
      pointer-events: auto;
    }
    .toast.error {
      background: #f1d8d2;
      color: #5e1414;
      border: 1.5px solid #a23232;
    }
    .toast.success {
      background: #dfeadc;
      color: #22421f;
      border: 1.5px solid #3f6b3f;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
  <!-- React 18 + ReactDOM + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>
  <div id="toast-container"></div>

  <!-- UI primitives (sketch.jsx ベース) -->
  <script type="text/babel" src="/static/js/sketch.js"></script>
  <!-- Calibration/Manual jog components -->
  <script type="text/babel" src="/static/js/calib-components.js"></script>
  <!-- Screens -->
  <script type="text/babel" src="/static/js/screens/system-states.js"></script>
  <script type="text/babel" src="/static/js/screens/init.js"></script>
  <script type="text/babel" src="/static/js/screens/profiles.js"></script>
  <script type="text/babel" src="/static/js/screens/calibration.js"></script>
  <script type="text/babel" src="/static/js/screens/modes.js"></script>
  <script type="text/babel" src="/static/js/screens/auto-drive.js"></script>
  <script type="text/babel" src="/static/js/screens/manual.js"></script>
  <script type="text/babel" src="/static/js/screens/learning.js"></script>
  <script type="text/babel" src="/static/js/screens/logs.js"></script>
  <script type="text/babel" src="/static/js/screens/schedule-sequence.js"></script>
  <!-- Main app -->
  <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
