# =====================================================================
# テスト用車両プロファイル（研究開発用）
#   docs/Problem/ProblemReport_20260910.md の手順 0〜10 が参照する
#   パラメータを 1 ファイルにまとめたもの。**ユーザーが直接編集してよい**。
#
#   使い方:
#     .venv/bin/python -m tests.research.main --list        # 手順一覧
#     .venv/bin/python -m tests.research.main --upto 0      # 手順0（設定検証）
#
#   注意:
#   - コメントは手順 2/4/6/8 の自動保存でも保持される（値の行だけ書き換える）。
#   - リストは 1 行の flow 形式（[a, b, c]）で書くこと。複数行の "- a" 形式は
#     自動保存が拒否する。
#   - ハードウェア設定（シリアルポート・CAN・GPIO）は本番と共通の
#     config/settings.toml を読む。ここには置かない。
#   - 開度の定義: 0% = 原点復帰位置（0 pulse）、100% = ストローク限界（9500 pulse）。
#     本番のキャリブレーションは使わない。原点からペダルに触れるまでの隙間は
#     vehicle.min_*_opening_pct（ペダルに触れた位置。手で測る）で表す。
# =====================================================================

# ── 車両（本番 VehicleProfile 相当） ─────────────────────────────────
vehicle:
  name: test_vehicle              # プロファイル名（結果ファイル名に使う）
  max_speed_kmh: 150.0            # 最高速 [km/h]
  max_decel_g: 0.45               # 最大減速G [G]
  # 2026-10-08 段2l-6（ProblemReport_20261001）: ペダルに触れた位置 [%]。待機位置（使っていない
  # ペダルをここに置く）であり、効く開度 u の原点でもある。不感帯の測定はやめた。
  # 仮値（今の待機位置: アクセル 10.53−4.0、ブレーキ 6.95−4.0）。
  # tests/hardware/test_calibration.py で測って書き換える。2026-10-17: 付け替えで測り直しても pkl は作り直さない
  # （段2l-7。手順3 の開度は u・停車保持・先置き・戻る時間とも min からの量で持ち、走る直前にこの min を足す）
  min_accel_opening_pct: 4.2      # アクセルがペダルに触れた位置 [%]
  max_accel_opening_pct: 61.0     # アクセル開度上限 [%]（機構保護）
  min_brake_opening_pct: 4.2      # ブレーキがペダルに触れた位置 [%]
  max_brake_opening_pct: 47.3     # ブレーキ開度上限 [%]（機構保護）
  stop_deviation_threshold_kmh: 2.0  # 異常停止判定の偏差しきい値 [km/h]
  stop_deviation_duration_s: 9999     # 上記が続いたら停止 [s]

# ── Feedforward（手順 2 で同定して自動保存される） ───────────────────
feedforward:
  # モデル候補（C1:ベース, C2・C3:C1 の派生, C4:V0実測値, C5:過去&V0実測,
  #   C7:順モデルの表のみ＝走る前に基準車速から開度の列を作る。下の forward_map 節を使う,
  #   C8:順モデルのモデル版＝C7 と同じ格子に線形回帰/Ridge/ニューラルネットを評価した pkl。同じく forward_map 節）
  # candidate と model_path は必ず組で書き換えてください。
  # candidate: C7 のとき model_path は fwd_table_*.pkl（手順2 か `fwd_tool build` が作る）、
  # C8 のとき fwd_model_*.pkl（手順2 か `fwd_final --out` が作る）を指す。
  # 2026-10-06 段2k: 手順2 はここに書かれた candidate の種類のモデルを作り、model_path を書き換える
  # （candidate は書き換えない。C8 のときは C7 の表 fwd_table_*.pkl も同じフォルダにできる）。
  # 組が合わない（C7/C8 に多項式モデル、C7 にモデルの pkl、C8 に表の pkl、C1〜C5 に表・モデルの pkl）と、走り出す前にエラーで止まります
  # 2026-10-20 段4-2 で C15 に変更（C15 `081609` |偏差|>1 3.7 秒 ↔ C12 組み合わせ `070645` 7.4・`084720` 5.9 秒）
  candidate: C15
  # 2次多項式 Ridge 逆モデル（本番 src/domain/model_training.py と同型）の保存先
  # ファイル名の日時はローカル時刻（JST）。2026-09-20 以前の pkl は UTC 命名（JST−9h）
  model_path: tests/research/results/models/fwd_model_20261022_020945.pkl
  # 停車〜クリープ域（滑らかなモデルで表現できないため定数で補う）
  creep_speed_kmh: 5.0  # クリープで到達する車速 [km/h]
  creep_rate_kmhs: 1.42  # クリープ加速率 [km/h/s]
  stop_brake_offset_pct: 13.68  # 停車保持ブレーキ開度のうち、ブレーキの min（触れた位置）からの量 [%]。手順 2-0 が「止まった開度＋マージン−min」を自動保存。2026-10-08 段2l-7: 取り付け直しで min が変わっても手順2 をやり直さずに済むよう、絶対開度から変更
  # 2026-10-19 段3（G6）: 基準車速をガウスでぼかす幅 σ [s]。0.0 ＝ ぼかさない（今と完全に同じ。既定）。
  # 根拠: C1 の往復が WLTP の 1 秒刻みの折れ点をなぞって増える（基準を σ 0.25s ぼかすと 0.84→0.31 回/s の
  # 机上。ただし仮説）。何に効くか: ぼかした基準を使うのは目標側だけ（開度の列・C10 の P の偏差・C11 の DOB の
  # 表の行・C12 の惰行の補助・C13 の予測の偏差）。KPI・偏差の記録・停車の判定・ガバナー・安全網・調停は元の基準。
  # いつ決めるか: 0.25 と 0.5 を実機 1 本ずつ走り、往復と偏差を比べて決める（模擬の点では決めない）
  ref_smooth_sigma_s: 0.0
  # 惰行（ペダル未操作）減速量。カーブが空なら下の定数を使う
  engine_brake_decel_kmhs: 0.700001  # 惰行減速量の代表値（正値）[km/h/s]
  coast_decel_speeds_kmh: [5.0, 5.5, 6.5, 7.5, 8.5, 9.5, 10.5, 11.5, 12.5, 13.5, 14.5, 15.0, 25.0, 35.0, 45.0, 55.0, 65.0, 75.0, 85.0, 95.0, 105.0, 115.0, 125.0, 135.0]  # 惰行カーブ 速度グリッド [km/h]（昇順）
  coast_decel_kmhs: [0.0, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.540001, 0.640001, 0.700001, 0.720001, 0.720001, 0.720001, 0.720001, 0.720001, 1.26, 2.04, 2.74, 3.24]  # 各速度での惰行減速量（正値）[km/h/s]
  # クリープ加速カーブ（0〜creep_speed_kmh の速度依存クリープ加速度。手順2で自動保存）。
  # ProblemReport_20260916 課題#2: 定数 creep_rate_kmhs 1個ではクリープ発進を表現できない
  # （実測では 1 km/h 地点で 1.5 km/h/s、平衡付近で 0 に落ちる）
  creep_accel_speeds_kmh: [0.5, 1.5, 2.5, 3.5, 5.0]  # クリープ加速カーブ 速度グリッド [km/h]（昇順）
  creep_accel_kmhs: [2.22, 1.82, 1.34, 0.820001, 0.0]  # 各速度でのクリープ加速度（正値）[km/h/s]
  # 惰行とみなす要求加速度の帯（半幅）[km/h/s]。人が決める値で自動保存の対象外。0 で無効。
  # 2026-09-17 段2: 実測ログ上の試算でアクセル⇔ブレーキ反転 106→21回・帯にいる間の最大ドリフト
  # 0.31km/h（KPI 1.0 の 1/3）となる 0.5 を採用
  coast_band_kmhs: 0.5
  # 2026-09-18 段3（到達可能性判定。ProblemReport_20260916 課題#1・#3）: 惰行のまま進んだ先の
  # 速度 v_free(t+h) を free_accel_at の数値積分で作り、各ホライズンの
  # need(h) = (基準(t+h) − v_free(t+h)) / h でペダルを選ぶ。空リスト＝段3 無効（従来の
  # ホライズン 1.0s 1 点だけの判定）。モデルの先読みホライズン [0.5, 1.0, 2.0, 3.0] の部分集合。
  #
  # **2026-09-18 ユーザー決定により空（無効）のまま保留。** RunFF_6 の実測 11738 行で判定を
  # 回したところ、(1) 決め手が h=0.5 に 99.2% 偏り惰行が 0.0s に消える（need = Δ/h を加速度の
  # 帯と比べると速度の許容幅が 0.5×h になり最短ホライズンが常に一番厳しい）、(2) 旧規則と
  # ペダルの選択が違うのは 1.1%（6.2s）だけで A⇔B 切替は 10 回のまま、だった。段3 が狙った
  # 課題#1・#3 は段1＋段2 で既に解消済み（1 周期変化 p99 0.12%・切替 10 回/589s）で動かす余地が
  # 無い。実装とテストは残す（reachability.free_speeds_at は段4 のブレーキトリムで使う土台）。
  # 詳細は docs/Problem/ProblemReport_20260916.md「段3: 実装したが無効のまま保留」
  reach_horizons_s: []
  reach_step_s: 0.05              # v_free の数値積分の刻み [s]（制御周期と同じ）
  # ペダル選択を「区間の傾き G」で行うための窓（ProblemReport_20260929）。G は基準車速の
  # 「今から L 秒先」を中心にした幅 H 秒の区間の最小二乗の傾き。
  pedal_select_center_s: 0.25  # L [s]。手で決める値（2026-10-06 段2k: 格子ステップが無くなり、手順2／relearn は書き換えない）
  pedal_select_width_s: 3.0       # H [s]。手で決める値（自動保存の対象外）
  pedal_select_mode: window        # point=今までどおり 1 点の傾き / window=窓の傾き G
  pedal_select_point_s: 1.0       # point の先読み [s]。ペダル選択だけに使う（モデルの h1＝features.h1_s とは別。1.0 で従来と同じ）
  # L_b [s]: ブレーキの判定（ブレーキか惰行か）だけに使う窓の中心（window 方式のみ。point と併用はエラー）。
  # null なら L と同じ＝従来どおり。アクセルかどうかは常に L の窓で先に判定する（アクセルの行は不変）。
  # 根拠（ProblemReport_20260930 段2-1）: 再計算で L=0.3→0.0 にすると指令→基準の減速の踏み始めが
  # +0.51→+0.21s に縮む（ペダルの遅れの目安 +0.13〜0.19s）。入り・離しの両方に効く。手で決める値
  # （自動保存の対象外）。実機で試すときだけ 0.0 などへ書き換える（0.0<=L_b<=2.0）
  pedal_select_brake_center_s: 0.0
  # ペダルゲイン（開度1%あたり惰行から何 km/h/s 変わるか。どちらも正値）
  pedal_gain_speeds_kmh: [0.5, 1.5, 2.5, 3.5, 4.5, 5.0, 15.0, 25.0, 35.0, 45.0, 55.0, 65.0, 75.0, 85.0, 95.0, 105.0, 115.0, 125.0, 135.0]  # 速度グリッド [km/h]（昇順）
  accel_gain_kmhs_per_pct: [0.212953, 0.212953, 0.212953, 0.212953, 0.212953, 0.212953, 0.10205, 0.110711, 0.101325, 0.0979796, 0.0899257, 0.0824423, 0.0772811, 0.0670017, 0.0553775, 0.0774543, 0.0750002, 0.102559, 0.0982409]  # アクセル側ゲイン [km/h/s per %]
  brake_gain_kmhs_per_pct: [0.386097, 0.347356, 0.299156, 0.624061, 0.00488925, 0.36679, 0.479491, 0.271238, 0.408196, 0.49815, 0.607825, 0.475881, 0.481551, 0.502662, 0.603227, 0.536954, 0.344105, 0.344105, 0.344105]  # ブレーキ側ゲイン [km/h/s per %]

# ── 停車保持の判定ホライズン（C7・C8 のプラン作りが使う） ─────────────────────
#   h0_s: 最短ホライズン先の基準車速を見て停車保持かどうかを決める [s]。
#   （2026-10-09: C1〜C5 の特徴量・ホライズン自動選択のキーは削除した）
features:
  h0_s: 0.5

# ── 順モデルの表（C7・C8 のときだけ使う。開度の列を作る fwd_plan.build_plan への入力） ──
forward_map:
  # 惰行の帯 [km/h/s]。要る加速度が惰行の加速度から ± この値以内ならペダルを踏まない。
  # 仮値（ユーザー決定 2026-10-03）。小さいとアクセル⇔ブレーキの切替が増え、大きいと追従が甘くなる
  # （検算で最大偏差 0.63→1.03 km/h）。フィードバックを入れる段で見直す。
  # feedforward.coast_band_kmhs（C1 用 0.5）とは別物
  coast_band_kmhs: 0.25
  # 要る加速度を測る窓の幅 [s]。仮値（表を作るときの加速度の窓 1.0 秒にそろえた）。
  # FF のなめらかさに効く。実機後に見直す
  need_window_s: 1.0
  # 開度が効くまでの遅れ [s]。null なら pkl に入っている値（表を作ったときの遅れ）を使う。
  # データ由来（段2g で 0.05 秒刻みに振って外れが最小＝0.05 秒）。表と違う値を入れると
  # 表の定義とずれるので、通常は空のままにする
  accel_lag_s: null
  brake_lag_s: null
  # 次に踏むペダルの先置き（2026-10-16 段2o-6）。片足のルール（片方が min より上なら、もう片方は
  # min）を守りつつ、踏み出しの preposition_lead_s 前から min → 効き始めの手前へ置いておく。
  # pkl の meta に効き始め（accel_onset_u_pct・brake_onset_u_pct）があるペダルだけ。false なら
  # 今までと同じ列
  preposition_enabled: true
  # 効き始めからの手前の量 [%]。ユーザー決定。効き始めは遅れ 0 で計算するので深い側に出る
  # （054131 で最大 0.35%）。それより大きく取る
  preposition_margin_pct: 0.5
  # 踏み出しの何秒前から置きにいくか [s]。ユーザー決定の仮値。062214 の遊びの通り抜け
  # 0.15〜0.17 秒に近い。手順3 の後に、実開度が間に合ったかで決め直す
  preposition_lead_s: 0.2
  # 2026-10-17 段2p（C10 のときだけ効く。candidate が C8 なら使われない）: 偏差（基準−実車速）を
  # τ 秒で 0 に戻す加速度を、今の開度の列に足す。τ ＝ deviation_c × 手順2 で測った遅れ（ペダル別）。
  # 単位なし。0 なら C10 でも C8 と同じ出力。
  # 100 の根拠: 前の車で C5 がばたついた c 13〜24 の 4 倍以上（別の形の制御での値。仮値）。
  # 効く先: 偏差の積み上がり（最大逸脱）と、ペダル往復（ばたつき）。大きいほど弱く上乗せする。
  # 決めるタイミング: 実機で 100 → 50 と縮める。案A・案B を比べた後
  # 2026-10-18 段2p で 25 に決定（50 → 25 で p95 1.45 → 0.89。12.5 は往復 KPI 超え）
  # 2026-10-20 段4-1 で 12.5 に変更（KPI の決め直しで往復は不採用の理由にしない。Tq 係数 20 と組み合わせ
  # `070645` |偏差|>1 7.4 秒 ↔ 続けて走った C12 `074439` 55.6 秒）
  deviation_c: 12.5
  # 表を引く車速の行。reference＝基準車速（案A）／actual＝実車速（案B）。両方を実機で比べて決める
  # 2026-10-18 段2p で案A に決定（案B は p95 0.89 → 1.01 で悪化）
  deviation_row: reference
  # 2026-10-18 段2q（C11 のときだけ効く）: 外乱の推定（実加速度 − 表の予測。ペダル別）をならす
  # 時間 Tq ＝ dob_tq_coef × 手順2 で測った遅れ（ペダル別）。単位なし。仮の全車共通係数。
  # 40 の根拠: 遅れ約 0.25 秒で Tq ≒ 10 秒。実加速度の乱れ ±0.4〜0.5 km/h/s をならして推定の幅
  # ±0.2 程度（ProblemReport 段2p の全体計画）。効く先: 外乱 × τ の残る偏差（大きいほど遅く追う）。
  # 決めるタイミング: 実機で 40（乱れれば 20、問題なければ 5 も）を試し、段2s で決め直す
  # 2026-10-20 段4-1 で 20 に変更（deviation_c 12.5 と組み合わせ。根拠は deviation_c の注記）
  dob_tq_coef: 20.0
  # 2026-10-18 段2r（C12 のときだけ効く）: 惰行の行（ペダルを踏まない計画の行）の補助。
  # 偏差が積み上がったら、浅く踏んで戻し、惰行でも偏差を詰める。
  # coast_on_kmh／coast_off_kmh: 入る／離す偏差の大きさ [km/h]。全車共通の仮の値
  # （KPI の |偏差|>1 km/h の帯の半分 0.5 と 2 割 0.2）。効く先: 入る・離すのばたつき
  # （on を下げると早く入るが回数が増え、off を上げると早く離すが小刻みになる）。
  # 決めるタイミング: 2r の実機で 1〜2 通り試して決める
  coast_on_kmh: 0.5
  coast_off_kmh: 0.2
  # 保持時間 ＝ coast_hold_coef × (手順2 で測った遅れ ＋ 効き始めまでの戻り時間)（ペダル別）。
  # 単位なし。全車共通の仮の値。効く先: 一度踏んだら最低これだけ保ち、入り直しを間引く長さ。
  # 押した効果（遅れ後の加速度）が出てから離すか判断するため。決めるタイミング: 2r で決める
  coast_hold_coef: 4.0
  # 段2r ②。補助の踏み込みが遊びの中に入って効かないのを防ぐ。効き始めは手順2 で測った値。
  # 172228 でブレーキが効き始めの手前に止まった
  coast_floor_onset: true
  # 段2r ③。175934 で長い惰行（19 秒）の後半に遅れが +2.93 まで積み上がり、反対のペダルに入れなかった。
  # false: 前の補助のペダルが min に戻り、保持時間がたったら反対のペダルにも入る
  coast_one_pedal_per_section: false
  # 2026-10-19 段2u（C13 のときだけ効く）: 遅れの予測器 ＋ 車速のフィルタ（speed_predictor.py）。
  # 遅れ L 秒先の車速を「フィルタの推定車速 ＋ 遅れ前からの実指令を表で積み上げた分」で予測し、
  # C10 の P の上乗せの偏差を「基準の L 秒先 − 予測」で取る。DOB の実加速度にもフィルタを使う。
  # false なら C13 でも C12 と同じ指令（フィルタも予測も動かさない）。
  predictor_enabled: true
  # 表の予測加速度の外れの分散 σ_a² [(km/h/s)²]（フィルタの Q の元）。null ＝ pkl の meta の
  # seed_mae（学習の加速度の MAE。測った値）から自動。数値なら上書き。効く先: 小さいほど表を信じ、
  # CAN をならす。決める時期: 実機 1〜2 本の後（今は自動のまま）
  speed_filter_q: null
  # 観測雑音の分散 R [(km/h)²]。null ＝ 走行の最初の停車保持の CAN 車速の乱れ（2 階差分）から自動。
  # 数値なら上書き。効く先: 大きいほど CAN をならす（遅れが増える）。決める時期: 同上
  speed_filter_r: null
  # R の下限 [(km/h)²]。停車中の CAN 車速が一定値に張り付いて乱れが 0 に測れたとき、フィルタが
  # CAN を無視しないための仮値。1e-4 ＝ (0.01 km/h)²。根拠: 094422 の定速の 2 階差分から見た
  # 乱れの上限が σ≈0.008 km/h（停車保持中は 0.000 で測れなかった）。決める時期: 実機 1〜2 本の後
  speed_filter_r_floor: 0.0001
  # pkl に seed_mae が無いときだけ使う σ_a [km/h/s]。仮値 0.2（094422 の pkl では seed_mae 0.147 →
  # σ 0.185 なので使われない）。決める時期: seed_mae の無い pkl を使うときに決める
  speed_filter_accel_sigma: 0.2
  # 2026-10-19 段3a（C14 のときだけ効く）: 停車の最後のブレーキの下限。元の基準が次に停車（0 km/h）へ
  # 着くまでこの秒数以内のとき「停車へ向かっている」とみなす [s]。仮値 5 s（停車保持の先読み
  # features.h0_s と同じ考え。実際に掛かる範囲は「基準・実車速がクリープ車速＋余裕以下」と重なって決まる）。
  # 効く先: 長いほど下限が早くから掛かる。決める時期: C14 の実機 1 本の後
  creep_floor_lead_s: 5.0
  # 2026-10-20 段4-2（C15 のときだけ読む）: 停車まぎわの 2 つの足し。新しい数値は置かず、値は
  # pkl の meta（brake_lag_s・stop_max_speed_kmh）と上の creep_floor_lead_s から決まる。
  #   停A（stop_lead_enabled）: 停車保持の開度を、ブレーキの遅れ（brake_lag_s）先の基準が停車速度以下
  #     になった時刻から指令する（今は基準が停車速度以下になった時刻）。根拠: 基準 0 の 2 秒前のブレーキ
  #     は 8〜12% と浅く、基準 0 の時点で実車が 0.3〜2.8 km/h 残る（止まるのは 0.2〜0.5 秒後）。
  #     発進で停車保持を抜ける時刻は変えない。
  #   停C（stop_end_p_enabled）: 基準が停止側の表の上の車速以下で、creep_floor_lead_s 以内に 0 になる行
  #     （停車保持の行を除く）の P のブレーキ側の τ を、基準が 0 になるまでの残り時間（ブレーキの遅れ
  #     より短くしない）にする。速すぎれば深く・遅すぎれば浅く。min より浅くせず、停車保持より深くせず、
  #     アクセルへは移らない。
  # 効く先: 停車まぎわの |偏差|>1 の秒数（C12 では 6〜8 秒、最大 2〜2.9）。
  # 決める時期: C15 の実機 1〜2 本の後（C12 と続けて走って比べ、効かなければ false にする）
  stop_lead_enabled: true
  stop_end_p_enabled: true
  # 2026-10-22 段5-2: 低速（pkl の meta の stop_max_speed_kmh 未満）で引く表の決め方。
  #   legacy: 今まで。発進側 ＝ 要る加速度 ＞ 0、停止側 ＝ 減速かつ停車の 0.5 秒前から。残りは本体・戻しの表。
  #   pedal : アクセルはいつでも発進側。ブレーキは発進の途中（停車保持を抜けてから初めてアクセルを使うまで）
  #           だけ発進側（動き出す開度 launch_breakaway_u_pct より深くなる行は停止側）、それ以外は停止側。
  #           低速では本体・戻しの表を使わない。P・惰行の補助・DOB の予測も計画が決めた表を使う。
  #           表が発進側・停止側の両方を持たないときは legacy と同じ。
  #   dir   : （段5-6）低速も 7.5 km/h 以上と同じ「踏み込み・保持／戻し」で引く。ペダルを離した加速度は停止側の表。
  #           ブレーキは発進の途中が発進側（踏み増さない）、それ以外は停止側で解き、浅くなったら本体の戻しの効き。
  #           アクセルは低速が発進側。表が発進側・停止側の両方を持たないときは legacy と同じ。
  # 効く先: 7.5 km/h 未満の指令。既定 legacy ＝ 今と同じ。決める時期: 段5-2 の実機（C8 の WLTP・UDDS・US06）の後
  low_speed_side_rule: legacy
  # 2026-10-22 段5-5c: 切り替えの先読み。true なら、アクセル ⇔ ブレーキの切り替えと深いブレーキを惰行へ戻す所の
  # 前だけ、要る加速度を見る時刻を「戻る時間 ＋ 次のペダルの遅れ」だけ早める（窓を縮めても切り替えが間に合うように）。
  # 先読み時間は手順2 で測った pkl の meta（*_return_delay_s・*_return_rate_pct_s・*_lag_s）から決まる（データ由来）。
  # 既定 false ＝ 今と同じ。効く先: 切り替え・戻しの直前。決める時期: 段5-5a/b の実機の後
  switch_lead_enabled: false
  # 2026-10-22 段5-3: 基準がこの車速 [km/h] 未満のブレーキの行は戻しの表で解き直さない（本体のまま）。
  # 既定 0.0 ＝ 今と同じ。15.0 なら 7.5〜15 km/h で使わない（段3b の「戻し 7.5〜20 が弱い」対策。仮値）。
  # 効く先: 戻しの解き直し。決める時期: 段5-3 の机上（stage5_side_candidates.py）の後の実機 1 組
  release_table_min_kmh: 0.0
  # 2026-10-17 段2o-9: 置くまでの待ち（preposition_clear_s: 0.1）は廃止。待ちは「戻す側のペダルが
  # min に戻るまでの時間」（pkl の meta の戻る時間。手順2 で測る）で決める

# ── フィードバック誤差学習 FEL（2026-10-19 段2s-2。補正表 c を f に足して引く） ──
#   補正表 c は pkl に別に持つ（元の f は書き換えない）。手順2 の学習の走りの後に作り、手順3 の中では
#   更新しない。enabled: false または pkl に補正表が無ければ今と完全に同じ。
fel:
  # 補正表を使うか。2s-3 の後の机上と 2s-4 の実機比較で決める（それまで false）
  enabled: false
  # 補正の作り方。cell ＝ マスの平均／nn ＝ 小さなニューラルネット（20×2・relu・3 本平均）。
  # 2s-3 の後に「学習用パターンで学習 → WLTP 183428 に当てる」机上で選ぶ
  method: cell
  # 補正の上限 ±[km/h/s]。机上（fel_check）の仮値。大きいと学習のばらつきをそのまま拾い、
  # 小さいと外れを直しきれない。2s-3 の机上で見直す
  c_max_kmhs: 0.5
  # cell で補正を出すマスの最小秒数 [s]。机上の n_min 40 行 × 0.05 s。少ないマスの平均を信じない
  min_cell_s: 2.0
  # マスの車速の境界 [km/h]（机上 fel_check の V_EDGES。表の車速の行の境と独立に切る）
  speed_edges_kmh: [0.3, 2.5, 5.0, 7.5, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0, 60.0, 80.0, 100.0, 140.0]
  # マスの u の幅 [%]（机上の値。アクセル 1.0・ブレーキ 0.5。ブレーキは効きが細かいので細かく切る）
  accel_u_bin_pct: 1.0
  brake_u_bin_pct: 0.5
  # ── 学習用パターン（2026-10-19 段2s-2b。手順2 の 2-3 で走る。fel_pattern.py が選んだモード
  #    modes.coverage_mode_names の基準車速の統計から規則で作る。毎回同じ）。以下はすべて全車共通の
  #    仮値。効く先: 補正表のマスの埋まり方（WLTP が通るマスを学習の走りがどれだけ通るか）。
  #    決める時期: 2s-3 の実機の手順2 の後、「FEL の埋まり方」の表示（足りないマスの一覧）を見て ──
  stop_hold_s: 5.0       # 頭とトリップの間の停車 [s]。停車の保持が安定して次の発進が同じ始まりになる長さ
  ease_start_kmh: 15.0   # 形 B で G を緩め始める車速。減速の G を数える下限も同じ（停車前の戻しの区間）
  stop_end_window_s: 3.0 # 各停車の直前、この秒数の |G| の中央値を停車前の G（g_end）にする
  low_trip_max_kmh: 60.0 # 低速の短い走りの上の車速は、最高車速がこれ以下のトリップの分位から取る
  low_trip_count: 8      # 低速の短い走りの本数（停車前の形 A〜D を 2 周するため 4 の倍数）
  cruise_s: 5.0          # 各段の定速。手順2 の定速の保持（ramp_cruise_hold_s）と同じ長さ
  mid_step_kmh: 15.0     # 中速の車速変化の幅（中央値の上下）。WLTP の中速域の加減速の幅の目安
  mid_round_trips: 3     # 中速の車速変化の往復回数
  mid_speed_min_kmh: 20.0 # 中速の上の車速（走っている間の基準車速の中央値）を数える下限
  high_speed_quantile: 0.9 # 高速の上の車速＝走っている間の基準車速のこの分位（上端は G ランプと同じ）
  high_coast_s: 6.0      # 高速の惰行の長さ。高速の惰行の減速を表の点として作る
  half_g_s: 3.0          # 形 C で G を半分にしている時間
  coast_s: 4.0           # 形 D の惰行の長さ
  accel_min_g: 0.02      # 加速の G の標本に入れる下限（定速付近を除く）
  pattern_dt_s: 0.1      # 学習用パターンの基準車速の刻み

# ── PID（手順 4/6/8 で適合して自動保存される） ───────────────────────
pid:
  kp: 0.0  # 比例ゲイン [%/(km/h)]（手順4で適合）
  ki: 0.0                         # 積分ゲイン [%/(km/h·s)]（手順6で適合）
  kd: 0.0                         # 微分ゲイン [%·s/(km/h)]（手順8で適合）
  output_limit_pct: 50.0          # PID出力の権限上限 [%]（FFの補助に留める）

# ── ペダル調停（段3: 機能ごとのスイッチ。1 つずつ有効化して実機で試す。全て false なら符号で振り分けるだけ） ──
arbiter:
  enable_deadband_compensation: false  # min（触れた位置）ぶんを上乗せするか（キー名は旧称のまま）
  enable_rate_limit: false             # 開度変化率を制限するか
  enable_hysteresis: false             # アクセル/ブレーキ切替ヒステリシス
  switch_hysteresis_pct: 0.5           # 切替ヒステリシス半幅 [%]
  accel_rate_limit_pct_s: 200.0        # アクセル開度レートリミット [%/s]
  brake_rate_limit_pct_s: 300.0        # ブレーキ開度レートリミット [%/s]
  accel_reengage_dwell_s: 0.3          # ブレーキ解放後のアクセル再踏込ディレイ [s]
  accel_release_rate_pct_s: 10.0       # 惰行遷移でアクセルを戻すレート [%/s]
  # 2026-09-29 段3b（ProblemReport_20260921 6-14）: 0.2 → 0.5。仮の値（半分データ由来）。
  # 053152 のアクセル往復は振幅 94% が 0.5% 未満。開ループ後掛け試算で 全体 2.41→0.58・60s最大 3.80→1.23 回/s。
  # 閉ループでは保持で偏差が溜まり効き方が変わるので、採否と値は実機比較で決める
  accel_min_step_pct: 1.0              # アクセル開度の量子化しきい値 [%]
  # 2026-09-30 段3c で無効化（微小変化の保持は加速度帯の保持に置き換え。ProblemReport_20260921 6-15）
  enable_min_step: false               # 微小変化の保持（変化が accel_min_step_pct 未満なら前回開度を保つ）
  enable_reengage_dwell: false         # ブレーキ後の再踏込ディレイ（accel_reengage_dwell_s の間アクセルを抑止）
  enable_release_rate: false           # 惰行でアクセルを accel_release_rate_pct_s で漸減（false は即 0）
  # 2026-09-30 段3c/3d（ProblemReport_20260921 6-15）。研究専用（src の調停にはない）。
  # 1 本目は段3c のみ有効。段3d は enable_direction_hysteresis を true に（単独比較は enable_accel_band: false）
  enable_accel_band: false             # 加速度帯の保持（計画加速度が帯の中かつ偏差変化が小さければアクセル開度を保つ）
  accel_band_horizon_s: 3.0            # 半分データ由来: 計画加速度＝基準 0〜3 秒先の直線近似の傾き（2s 未満は WLTP の 1s 段差が残る。ユーザー決定。次の候補 2s）
  accel_band_kmhs: 0.25                # データ由来（半分仮）: 往復の 95% は要求加速度の振れ幅 0.5 km/h/s 未満 → 半幅 0.25
  accel_band_dev_escape_kmh: 0.3       # 仮の値: 前回動かした時から偏差がこれ以上変わったら追従（保持で偏差が溜まるのを防ぐ）
  accel_band_open_escape_pct: 100.0    # 2026-09-30 実機: 100＝実質オフ（2% だと 19↔21% の矩形発振。6-16）。元は 2.0。2026-09-30 追加（ProblemReport_20260921 6-15）。仮の値。142539 への後掛け試算で、3s先の傾きが変わり目に約1.5s早く基準点を決めた後、FF 要求が 23→9% に下がっても保持し続けた（最大差 14%）。2% で抜けると往復 0.28→0.29 回/s・最大差 2% に収まる。値は実機比較で決める
  enable_direction_hysteresis: false   # 向きのヒステリシス（同じ向きはすぐ追従、逆向きは w% 戻る時だけ）
  accel_direction_hysteresis_pct: 0.5  # 仮の値: 段3b の実機で 0.5% 保持が効いた実績から。実機比較で決める

# ── 制御周期 ─────────────────────────────────────────────────────────
control:
  loop_interval_ms: 50            # 制御ループ周期 [ms]（本番と同じ）
  log_interval_ms: 50             # ログ記録周期 [ms]（loop の整数倍にすること）
  # 2026-09-17 段1b: 100ms → 50ms（ProblemReport_20260916 ユーザー決定。ログで詳しく解析するため）。
  # CAN 車速の更新は約10Hzなので、車速の列は2行に1回同じ値が並ぶ。新しく見えるようになるのは
  # 開度の列（制御は50ms周期なので、100msログでは指令の半分が記録されていなかった）
  can_max_speed_age_s: 0.2        # CAN車速の許容鮮度 [s]。超えたら異常

# ── 走行モード（DB の driving_modes の name で指定） ─────────────────
modes:
  wltp_mode_name: "01_WLTP_Low,Mid,Hi,ExHi"  # "01_WLTP_Low,Mid,Hi,ExHi", "02_WLTP_Low,Mid,Hi", "03_WLTP_Low", "04_WLTP_Mid", "05_WLTP_Hi", "06_WLTP_ExHi"
  tuning_mode_name: "__verify_pattern__"     # 手順 4/6/8 のPID適合用パターン
  # 手順2 の G ランプ走行が狙うモード（2026-10-06 段2k。段ごとの上端の車速をここのモードの
  # 「車速 × 加速度」の秒数から決める。確認: python -m tests.research.ramp_planner）。
  # wltp_mode_name は手順3 で走るモードと手順2 の MAE_WLTP 用で、ここには影響しない
  coverage_mode_names: ["01_WLTP_Low,Mid,Hi,ExHi", "09_US06"]
  # モード走行レポートの区間別集計（WLTP の区間名と境界 [s]。境界は区間名より 1 つ少ない）
  segment_names: [Low, Mid, High, ExHi]
  segment_bounds_s: [589.0, 1022.0, 1477.0]
  # 2026-10-19 段3b: 研究コード側の合成モード（DB は変えない）。走る直前に source の基準車速を
  # windows_s の各区間 [開始秒, 終了秒] で切り出し、時刻をつないで 1 本にする。wltp_mode_name に
  # name を書くと手順3 がそれを走る（DB より先にここを見る）。区間の端は停車の途中（0 km/h）で切る
  # （端が 0.5 km/h を超えるとエラー）。12_AMA_short: 64.4 km/h の組の最初の短い＋長いトリップ・
  # 48.3 の組・56.3 の組・72.4 の組・最後の高速部。各トリップの前後の停車 14s は残す（停車 14s の中央で切る）。
  # 秒は DB の 12_AMA の基準車速で確かめた（停車 248-262・483-497・787-801・2047-2061・2321-2335・
  # 3693-3707・3932-3946・4683-4697・5235-5249）。合計 1631s（約 27 分）
  # 2026-10-20 ユーザー決定: 最後の 2 山（112.7 km/h へ 6〜8 km/h/s の加速。アクセル上限 61% に張り付く）は
  # 車の特性上走れないので省く。最後の区間の終わりを 5249 → 4987（停車 4980-4994 の中央）。合計 1369s（約 23 分）
  composed_modes:
    - name: "12_AMA_short"
      source: "12_AMA"
      windows_s: [[0, 255], [490, 794], [2054, 2328], [3700, 3939], [4690, 4987]]

# ── モード走行（手順 3/5/7/9） ───────────────────────────────────────
mode_drive:
  # 減速G ガバナー（安全網）: 実測減速度（0.4s の傾き）が vehicle.max_decel_g × 0.98 以上になったら
  # ブレーキ開度をその時点で頭打ちにし、超えている間は 1 周期ごとに governor_reduce_step_pct ずつ下げる。
  # FF 指令が頭打ちより浅くなったら解除。作動した時間はレポートに出す（FF の純粋な結果を変えうるため）。
  # WLTP の減速は最大約 0.15G なので、FF が妥当なら作動しない
  decel_governor: true
  governor_reduce_step_pct: 2.0   # 超えている間 1 周期ごとに下げる量 [%]
  # 使っていないペダルの待機位置 = vehicle.min_*_opening_pct（ペダルに触れた位置。false なら 0%）。
  # 0% から触れる位置までの空走をなくし、ガバナーの 0% への大きな引き戻しもなくす（2026-09-13 急ブレーキ対策 1）
  # 手順2 の G ランプの減速でも、ブレーキの領域に入ったあとの下限に使う（2026-10-07 段2l-3）
  # 2026-10-08 段2l-6: 「不感帯 − standby_margin_pct」をやめ、min そのものにした
  pedal_standby: true
  # 2026-10-17 段2o-9: 走行中の安全網。もう一方のペダルの実開度が min（＋0.05%）を超えている間は、
  # 出そうとしているペダルを min のまま止める（指令ではなく実開度での両踏みを防ぐ）。止めた回数・
  # 秒数は走行の最後とレポート 5 章に出す。手順3 のみ（手順2 の走行には入れない）
  pedal_interlock_enabled: true

# ── 加振走行（ペダル→車速の周波数応答を開ループで測る。FF・PID は使わない） ────
#   ProblemReport_20260921 手順3 の 1.4Hz ばたつき対策: 一定速度に小さな正弦波を重ね、
#   フィードバックを使わずに P(f)（ペダル1%が車速を何km/h動かすか）を直接測る。
#   到達フェーズ（定速保持の PI で目標速度へ。learning.cruise_hold_* と同じ構造・同じ既定値）→
#   加振フェーズ（周波数ごとに正弦波。平均速度は遅いトリムだけで保つ）を
#   speeds_kmh × frequencies_hz ぶん繰り返し、最後に緩減速で停車する。
excite:
  # 2026-10-19 段2t（G1）: 開ループで 30・60・90 km/h を測り、P＋DOB のループの余裕（loop_margin.py）から
  # c（deviation_c）と Tq の係数（dob_tq_coef）を決める。測る速度は WLTP で使う帯の低・中・高。
  speeds_kmh: [30.0, 60.0, 90.0]                     # 加振する基準車速 [km/h]
  # 周波数 [Hz]。決まり G2 の余裕の計算に要る帯: 0.05 Hz（交差周波数の下側の傾き）〜2 Hz（−180° を
  # 越えた先）。−180° は 1.1〜1.2 Hz（2026-09-24 の実測）なので 1.0 / 1.2 / 1.4 で挟む。
  # 0.05 Hz は 1 周期 20 秒で 2 周期 = 40 秒かかるが、アクセルだけに置く（ブレーキは車速を保てず
  # 減速するので長くできない）。決めた根拠は実測の所要時間（下の見込み）が 45 分に収まること
  frequencies_hz: [0.05, 0.1, 0.2, 0.35, 0.5, 0.7, 1.0, 1.2, 1.4, 2.0]
  amplitude_pct: 0.3              # 基準開度に重ねる正弦波の振幅 [%]（ハード上限 1.0）
  hold_s: 12.0                    # 1 周波数あたりの加振時間 [s]（実際は整数周期に切り上げ）
  min_periods: 2                  # 1 ブロックの最低周期数。低周波で 1 周期だと 3 次トレンドと分離できない
  analysis_skip_s: 2.0            # 各ブロック先頭の過渡応答を解析から捨てる時間 [s]
  approach_timeout_s: 90.0        # 目標速度に入れなかったら中止 [s]
  # 実機の到達フェーズ PI は約 0.34Hz でハンチングし（速度標準偏差 0.34km/h）、狭い帯・短い整定
  # 時間だと settle が成立せず approach_timeout で中止していた（ProblemReport_20260921）。
  # 1.0 は定速保持で実績のある learning.cruise_hold_settle_tol_kmh と同じ値、6.0s はこの
  # ハンチング（周期約 2.9s）の約 2 周期分をカバーする長さ
  approach_band_kmh: 1.0          # この幅に入ったら整定とみなす [km/h]
  approach_settle_s: 6.0          # 上の幅に入り続ける必要がある時間 [s]
  # 到達フェーズの PI（learning.cruise_hold_* と同じ既定値。同じ車で 9.6〜141km/h の定速保持の
  # 実績がある構造をそのまま使う。到達フェーズはオーバーシュートしないことが最優先のため）
  approach_kp_pct_per_kmh: 0.3       # 比例ゲイン [%/(km/h)]
  approach_ki_pct_per_kmh_s: 0.05    # 積分ゲイン [%/(km/h・s)]
  approach_max_rate_pct_s: 1.0       # 1 周期あたりの開度変化量の上限 [%/s]
  approach_initial_offset_pct: 7.0   # 初期開度 = アクセルの min（触れた位置）+ この値 [%]
  trim_gain_pct_per_kmh_s: 0.05      # 加振中の「遅いトリム」の積分ゲイン（弱いので 1.4Hz は通さない）
  speed_lpf_tau_s: 1.0            # トリムに使う車速の1次ローパス時定数 [s]（1.4Hz を通さない）
  abort_band_kmh: 8.0             # 目標速度からこれだけ外れたら中止 [km/h]（過速は両フェーズで見る）
  # ── ブレーキの加振（2026-10-19 段2t）: C10/C11 はブレーキ側にも τ・Tq を持つので P_brake(f) も測る ──
  # 各速度でアクセルの後、周波数ごとに「目標 + brake_start_offset_kmh まで上げる → 惰行の減速を測る →
  # ブレーキを踏み足して『惰行 + brake_extra_decel_kmhs』になった開度を基準にする → 正弦波」。
  # 基準は実測の減速から決める（車のペダル位置の値は置かない）。車速は保てず下がり続けるので、
  # 1 ブロックの減速量（周波数が低いほど長い）が収まるよう始める車速を高くする
  # 2026-10-19 段2t 直し（実機 112326 の中止を受けて）: 基準の探索は速度ごとに 1 回だけ、ブロックは
  # 「ブロック中央が目標になる車速（目標 + d×T/2）」から始める。d×T が帯（2×abort_band−余裕）に
  # 入らない周波数は周期数を自動で減らし、1 周期でも入らなければ飛ばす。
  # 点の間引き: 0.05 Hz はアクセルのみ（1 周期 20 秒）。0.1 Hz はブレーキから外した（落ちが大きく、
  # 1 周期 10 秒 × 1.15 km/h/s = 11.5 km/h で帯にぎりぎり、しかも 1 周期ではトレンドと分離しにくい）。
  # 所要時間に余裕が出た（下の見込み）ので 1.2 Hz（−180° の近く）は戻した
  brake_enabled: true
  brake_frequencies_hz: [0.2, 0.35, 0.5, 0.7, 1.0, 1.2, 1.4, 2.0]
  brake_amplitude_pct: 0.3        # ブレーキ開度に重ねる正弦波の振幅 [%]（アクセルと同じ。仮値。SNR が低ければ上げる）
  brake_extra_decel_kmhs: 0.5     # 惰行より強く減速させる量 [km/h/s]（仮値。C10/C11 がブレーキを踏む行の弱い側）
  # 基準の探索（速度ごとに 1 回）を始める車速 = 目標 + この値。惰行 3 秒 + 踏み足し約 7 秒で
  # 約 8 km/h 落ちて目標付近で終わる（実機 112326 の実績）。ブロックの始める車速は別（d×T/2 から計算）
  brake_start_offset_kmh: 8.0
  brake_coast_s: 3.0              # ブレーキ前に惰行の減速を測る秒数 [s]（測定窓 2 秒）
  brake_ramp_pct_s: 0.5           # ブレーキを踏み足す速さ [%/s]（遅いほど基準の開度が精密）
  brake_ramp_max_pct: 12.0        # 踏み足す上限（min から）[%]。届かなければその速度は飛ばす
  # 仮値（実機の後に見直す）: ブレーキの遅れ 0.5 s（探索の戻し量 = (測定窓 2 s の半分 + 0.5) × 0.5%/s
  # = 0.75%）、帯の余裕 2 km/h、実際の減速が狙いの 1.5 倍を超えたらそのブロックを打ち切る
  # （1.5 倍まで進んでも最終的な見込みからのずれは 0.5×d×T ≒ 7 km/h で帯 8 km/h に収まる）
  brake_response_lag_s: 0.5
  brake_band_margin_kmh: 2.0
  brake_decel_cutoff_ratio: 1.5
  # 実機の所要時間の見込み: 約 30 分（estimate_duration_s。アクセル 3 速度 + ブレーキ 3 速度 ×
  # （探索 1 回 + 8 点 × 〈離し 1 s + 上げ直し d×T/0.55 km/h/s + 整定 6 s + ブロック〉）。上げ直しは
  # 実機 112326 の 0.55 km/h/s、d は 1.2 km/h/s と仮定。到達フェーズを 40 秒と仮定）。45 分を超えるなら
  # brake_frequencies_hz を減らす

# ── PID 適合（手順 4/6/8） ───────────────────────────────────────────
tuning:
  max_runs: 10                    # 1ゲインあたりの最大走行本数
  select_metric: p95_kmh          # 採用基準（p95_kmh / max_abs_kmh）

# ── 学習運転（手順 2 の閉ループパターン走行） ────────────────────────
learning:
  timeout_s: 7200.0               # 走行完了待ちのタイムアウト [s]（2026-09-25 段4: 格子ステップ走行は実車で約 30 分の見込み。余裕として 3600）
  coast_timeout_s: 300.0           # コーストダウン 1 本の上限 [s]
  # 2026-10-06 段2k 段A: G ランプ走行（手順2。ramp_planner がモードの秒数から段を自動で決める）
  # 狙いの G の段 [G]。データ由来（WLTP＋US06 の 1 秒ごとの加速度の秒数の帯の中ほど）。
  # 2l の実機後に網羅表を見て決め直す。昇順・正・最大は vehicle.max_decel_g 以下
  ramp_g_levels: [0.02, 0.045, 0.08, 0.125, 0.175, 0.25, 0.35]
  # 上端の車速を決める最小秒数 [s]。仮値（その車速帯にモードが 2 秒以上いれば走る）
  ramp_mode_min_s: 2.0
  # 選んだモード（modes.coverage_mode_names）の最高車速にこれを足した車速を、コーストダウンと
  # G ランプの上端にする（vehicle.max_speed_kmh で頭打ち）。ユーザー指定 2026-10-07 段2l-4
  ramp_top_margin_kmh: 5.0
  # G ランプ全体の時間の枠 [s]。30 分 −（ペダル探索 約196＋コーストダウン 約93＋クリープ 約108＋
  # モデル作成）から決めた値。モデル作成時間を測って決め直す
  # 2026-10-14 段2o-4: 1500 → 1910。中間の段に入れる保持（1 回の見込み 14 秒 × 27 回。2 周目を含む）の分。
  # 今の周回数を保つ。ユーザー決定（手順2 全体 約 39 分を許容）
  # 2026-10-14 段2o-5: 1910 → 2060。下りの戻し（1 回の見込み 7.5 秒 × 0.045G 8・0.08G 3・0.125G 2・0.175G 1 か所、
  # 2 周目を含む）の分。今の周回数（0.045G と 0.125G が 2 周）を保つ 1・2 周目の合計 2058 秒を 10 秒単位に切り上げ。
  # 手順2 全体は約 +3 分（戻し 24 か所で約 180 秒）。ユーザー決定 2026-10-14（実機確認まで一気に実装）
  # 2026-10-17 段2o-8: 2060 → 1600。ramp_max_passes: 1 で枠は周回数に効かなくなったので、
  # 1 周の見込み（約 1559 秒）に余裕を足した値。1 周目が延びたら警告で気づくためのもの（ユーザー決定）
  ramp_time_budget_s: 1600.0
  # 2026-10-17 段2o-8: G ランプの 1 段あたりの最大周回数。2 周目は枠の余りで足していたもの（測る必要から
  # 入れたものではない）。段2o-8 で 2 周目を抜いたモデルを手順3 で比べ、同じくらいなら 1 にする
  # （ユーザー決定 2026-10-17）
  # 2026-10-17 ⑤ 手順3 052022: 指令は 2 周目ありとほぼ同じ（平均差 0.07%）、悪化は車両側の差 → 1 にする
  ramp_max_passes: 1
  # 2026-10-13 段2o-2: いちばん弱い段（ramp_g_levels の最小）の途中で定速を保持する（上り・下り）。
  # 保持の定義: 実測の加速度が ±ramp_cruise_band_g 以内だった時間の合計が ramp_cruise_hold_s で次へ
  # （ペダル固定は条件にしない）。保持する車速: ramp_cruise_fine_max_kmh 以下は 10 km/h 刻み、
  # それより上は ramp_cruise_coarse_step_kmh 刻み（モードの定速が ramp_mode_min_s 以上ある帯だけ。
  # クリープ車速 ＋ 5 km/h 未満は保持しない）。時間は 1200 → 1500 秒（ユーザー決定）。
  # band_g: 半分データ由来（学習の穴だった ±0.01G の帯の半分）。hold_s・fine_max・coarse_step:
  # ユーザー決定。timeout_s: 仮値（入ってから落ち着かなければ打ち切る時間）。
  # 効く先: 定速付近（±0.01G）の表の点。次の手順2 実機の後に決め直す
  ramp_cruise_band_g: 0.005
  # 2026-10-19 段2s-2 短縮 7.0 → 5.0。机上（075823 の定速の保持を 5 秒で切った CSV で作り直した表）で
  # 表はほぼ不変（|r| +0.002）、手順2 が約 122 秒短くなる。効く先: 定速付近の表の点の数。
  # 決める時期: 2s-3 の実機の手順2 のチェックで定速の点が足りなければ戻す
  ramp_cruise_hold_s: 5.0
  ramp_cruise_timeout_s: 15.0
  ramp_cruise_fine_max_kmh: 100.0
  ramp_cruise_coarse_step_kmh: 20.0
  # 2026-10-14 段2o-5: 下り（減速）の途中の「戻し」（いちばん弱い段以外）。ブレーキを踏んでいる山から
  # 離して惰行まで戻し、−G へ踏み直す（モードの減速の 3 割強は走行中のブレーキの戻し。手順2 にそれが
  # 無く、戻し中の効きが表より弱かった）。山の開度 u_peak を ramp_release_fracs の割合へ
  # ramp_release_move_s かけて直線に離し、対応する ramp_release_hold_s 秒だけ保持する。0 は待機位置。
  # 空リスト [] なら戻しを入れない（今までどおり）。戻す車速はモードの減速から planner が決める。
  # fracs [0.5, 0.0]: ユーザー決定 2026-10-14（半分まで離す → 待機位置まで離す）。割合なので車に依存しない。
  # hold_s [1.5, 2.0]: ユーザー決定の流れ（半分で保持 → 惰行）。秒数は仮値。
  # move_s 1.0: 仮値（モードの戻しの速さ中央値 1〜2 %/s に合わせた 1 区間の移動時間）。
  # 効く先: ブレーキ側の「戻し中」の表の点（C8 の戻し量）。次の手順2 実機の後に決め直す
  ramp_release_fracs: [0.5, 0.0]
  ramp_release_move_s: 1.0
  ramp_release_hold_s: [1.5, 2.0]
  # 2026-10-16 段2o-6: ユーザー決定。①手順2（戻しあり）と ③手順2（戻しなし）を比べるための切り替え。 **結果に差がなかったためfalseで運用を行う**
  # false なら RAMP_RELEASE に入らない（下りはそのままブレーキで続ける）。planner の戻す車速・周回数・
  # 見込み秒数は変えないので、戻し以外の走り方は同じ。ramp_release_fracs: [] で切ると周回数が
  # 変わるおそれがあるので、切り替えはこのキーで行う
  ramp_release_enabled: false
  # 2026-10-13 段2o-2: ペダルの遅れの測定（手順2 の G ランプの後ろ。ユーザー決定）。
  # ramp_lag_speeds_kmh の各車速を上端とする段（狙いの G は ramp_lag_approach_g）の定速の保持の後に、
  # 開度を固定でステップさせる: アクセル踏み増し → 戻し → 離す → ブレーキ踏み増し → 戻し
  # （1 つの開度につき ramp_lag_step_hold_s 秒）。踏み増しの大きさは ramp_lag_step_g の加速度が出る
  # 開度の差（表が引けなければ ramp_lag_step_g ÷ 感度）。[] なら測らない（遅れは既定値 0.05 秒のまま）。
  # speeds [30, 60]: 半分データ由来（15 km/h 以下は表の外れが大きい・WLTP は 15〜60 km/h に長くいる）。
  # step_g 0.05: 半分データ由来（保持中の加速度のばらつきの 7 倍以上）。
  # step_hold_s 2.5: 仮値（既存の推定 pedal_lag.MIN_STEP_S 2.4 秒に合わせた）。
  # approach_g 0.125: 仮値（ramp_g_levels にある段。30・60 km/h へ 7・14 秒で着く）。
  # 効く先: 順モデルの表の遅れ L（accel_lag_s・brake_lag_s）。次の手順2 実機の後に決め直す
  ramp_lag_speeds_kmh: [30, 60]
  ramp_lag_step_g: 0.05
  ramp_lag_step_hold_s: 2.5
  ramp_lag_approach_g: 0.125
  # 2026-10-06 段2k 段B: G ランプ走行の制御
  # 偏差（基準車速 − 実車速）を何秒で詰めるか [s]。Kp ＝ 1 ÷（走行中に測った感度 × これ）、
  # Ki ＝ Kp ÷（4 × これ）。アクセル・ブレーキ共通（ユーザー決定 2026-10-09: 最初は共通）。
  # 半分データ由来（変更前の式と同じ強さになる値）。次の手順2 実機の後に決め直す
  ramp_settle_time_s: 2.0
  # 2026-10-09 段2l-9: G ランプの狙いの加速度 g_ref を立ち上げる・切り替える・戻す時間 [s]。
  # 動き出し（シャシダイナモ上でいきなり強い G を出さない）と止まる瞬間のため。0 なら丸めない。
  # 発進（動き出した周期から 0 → +G）・停止（-G → 0。基準車速から決める）は半分データ由来
  # （US06 の発進 5 回は最初の 1 秒が 0.01〜0.12G、停止 5 回は最後の 1 秒が 0.05〜0.12G）。
  # 切り替え（折り返しで +G → -G）は仮の値（段2l-8 のまま、置き場所だけ移した）。
  # 2026-10-10 段2l-10: 切り替えは 1.0 → 2.0 秒（+G → 0 と 0 → -G の各片道の時間。ユーザー決定の
  # 仮の値。1.0 秒は車の反応（約 1.4 秒）より短かった）。
  # 効く先: 動き出し・止まる瞬間の G と、折り返しで開度が動く速さ。次の手順2 実機の後に決め直す
  ramp_launch_time_s: 1.0
  ramp_turn_time_s: 2.0
  ramp_stop_time_s: 1.0
  # 発進の始まりと停止の終わりの狙いの G [G]（0 → +G、-G → 0 ではなく 0.05G → +G、-G → 0.05G）。
  # 0 にすると基準車速が 0 km/h に着いたあとブレーキが緩み、停車まで長くかかる（スタブで約 30 秒）。
  # 仮の値（ユーザー指定 2026-10-09: この程度ならスリップや揺れは出ない。US06 の停止の最後の
  # 1 秒は 0.05〜0.12G）。狙いの G がこれより小さい段は丸めない。次の手順2 実機の後に決め直す
  ramp_edge_g: 0.05
  # 2026-10-18 段2o-10 A: G ランプの発進の離し方（ブレーキ開度 [%/s]）。
  # ① 停車保持開度 → 「止まる点（2-0 の stop_confirm_pct）＋ margin」を fast_rate で一定に離す。
  # ② そこから slow_rates を発進ごとに順に使い、車が動き出す（creep_launch_min_speed_kmh 以上）まで
  # 離す。動き出したら今の制御（偏差で離す）へ。② の上限は (止まる点＋margin−min)÷slow_rate＋5 秒。
  # 仮値・根拠: 遅れ 0.2 秒 × 0.25%/s ＝ 0.05% の細かさで動き出す開度を測る。① は踏み増す向きの
  # 止まる点より 2% 深い所までは動かない見込み。
  # 効く先: 測り方の細かさだけ（制御には使わない）。0 以下・空配列は読み込みエラー。
  # 決める時期: 手順2 の実機の結果で見直す
  ramp_launch_fast_rate_pctps: 2.0
  ramp_launch_release_margin_pct: 2.0
  ramp_launch_slow_rates_pctps: [0.25, 0.5]
  # 2026-10-10 段2l-10: 最高速での保持 [s]（+G → 0 の切り替えが終わってから 0 → -G が始まるまで）。
  # 根拠: ユーザー決定の仮の値（041505 でアクセルを戻してから減速に転じるまで約 1.4 秒）。
  # 効く先: 減速に入る前に車が落ち着く時間。長いほど所要時間が増える。次の手順2 実機の後に決め直す
  ramp_hold_time_s: 7.0
  # 2026-10-10 段2l-11: 強い G の段で基準が狙いの G にいる時間の下限 [s]。
  # 上端 ＝ max(モードから決めた上端, 立ち上げで進む車速 ＋ G×35.3×(この値 ＋ ramp_turn_time_s÷2)
  # を 10 km/h に切り上げ)。根拠: ユーザー決定 2026-10-10（0.35G の段が 60 km/h になる値。3.3 だと
  # 計算値 60.2 で 70 km/h に切り上がるため 3.25）。実機 063905 で上端 30 km/h の 0.35G は狙いの G に
  # いる時間が計算上 0.9 秒で届かなかった。時間の設定だけで決まり、車に依存しない。
  # 効く先: 強い G の段の上端（長いほど高い車速まで走り、所要時間が増える）。0 で無効。
  # 次の手順2 実機の後に決め直す
  ramp_min_at_g_s: 3.25
  # 2026-10-10 段2l-11: 発進の寄せ（アクセルに移った周期に、段の G が出る表の開度へ等速で足す）の時間
  # ＝ (段の G − 発進の G ramp_edge_g) ÷ ramp_launch_g_rate_gps、ただし ramp_launch_blend_min_s より
  # 短くしない。0.02〜0.125G は 0.5 秒、0.175G 0.83 秒、0.25G 1.33 秒、0.35G 2.0 秒。
  # 根拠: ユーザー決定 2026-10-10。実機 063905 で寄せ 0.5 秒は 0.08G の段では問題が無く、0.25G・0.35G
  # の段でだけ G が急に上がりガバナーの先読みが働いた。0.15 G/s は 0.35G の段が 2 秒になる値、
  # 0.5 秒は段2l-10 までの寄せの時間（どちらも仮の値。G の上がる速さと時間で、車に依存しない）。
  # 効く先: 発進で G が上がる速さ（速いほどガバナーが働きやすく、遅いほど低速の強い G が取りにくい）。
  # rate を 0 にすると全段 ramp_turn_time_s。次の手順2 実機の後に決め直す
  ramp_launch_g_rate_gps: 0.15
  ramp_launch_blend_min_s: 0.5
  # 2026-10-12 段2l-12: G ランプを踏み増し側だけで調整する（ユーザー決定）。加速（RAMP_UP）は車が基準
  # より遅いときだけ u を増やし、減速（RAMP_DOWN）は車が基準より速いときだけ u を減らす。行き過ぎて
  # いるときは開度を動かさず基準車速を実車速に合わせる。実測の G（0.4 秒の傾き）が段の上端
  # （ramp_g_levels の隣の強い段との中間。いちばん強い段は無し）を超えた周期だけ、Kp ×（実測の加速度
  # − 狙いの加速度）で戻す。保持と停止の直前は両方向のまま。
  # 根拠: 実機 114602 で 0.045G の減速のブレーキが ±0.2% で 1.38 回/秒往復し、減速が 0.023〜0.068G で
  # 揺れた。目的は表を貯めることで基準どおりに走ることではない。上端は段の一覧から決まり車に依存しない
  # （0.02G の +20% は実測 G の揺れより狭く、114602 で 13.5% の時間が超えるため一律 % にしない）。
  # false で両方向（段2l-11 までの動き）。次の手順2 実機の後に見直す
  ramp_one_sided: true
  # 偏差（基準 − 実車速）の不感帯 [km/h]。|偏差| がこれ以下なら偏差の項を 0 にし、外側は不感帯を引いた
  # 量（境目で開度が飛ばない）。根拠: ユーザー決定の仮の値（041505 の車速の行間の揺れは 0.02〜0.19
  # km/h）。効く先: 車速の細かい揺れで開度を動かさない。基準が 0 km/h に着いた後の減速と発進の置き直し前は
  # 使わない。次の手順2 実機の後に決め直す
  ramp_dev_deadband_kmh: 0.5
  # アクチュエータが指令に追いつかない間（|指令 − 実開度| がこれを超え、さらに離れる向きに指令を
  # 動かす周期）、基準車速を待たせ始めるずれ [%]。根拠: 仮の値（表の開度のマス幅 2% に合わせた）。
  # 効く先: 基準が車から離れすぎない（送り方を手順3 と同じにしたので通常はほぼ働かない安全網）。
  # 次の手順2 実機の後に決め直す
  ramp_actuator_lag_tol_pct: 2.0
  # G ガバナーの「踏み増しを止める割合」。ユーザー決定（2026-10-06）: 0.85 → 0.95
  # （0.95 × 0.4G × 0.98 ≒ 0.37G。上限 0.4G は変えない）。0.35G の段が届くようにする
  gov_soft_frac: 0.95
  # ペダルゲイン推定に使うサンプル: 開度 ≥ min（触れた位置）+ この値 [%]（本番は 5%。ブレーキは +5% ≈ 0.38G で採れない）
  accel_gain_min_offset_pct: 0.5
  brake_gain_min_offset_pct: 0.5
  # コーストダウンの終了判定（段7c。pattern_loop の _coast_creep_settled）に使う。
  # 傾き（毎周期の車速の傾き）がしきい値を下回り続けたらクリープ平衡到達とみなす
  creep_launch_settle_kmhs: 0.1    # 平衡到達とみなす車速の傾きのしきい値 [km/h/s]
  creep_launch_settle_s: 2.0       # 傾きがしきい値を下回り続けたらこの秒数で終了 [s]
  creep_curve_bin_kmh: 1.0         # クリープ加速カーブのビン幅 [km/h]
  creep_curve_min_bin_samples: 5   # 採用する最小サンプル数/ビン
  # stop_brake_curve_bin_kmh: 0.5         # 停止ブレーキ境界カーブの速度ビン幅 [km/h]
  # stop_brake_curve_min_bin_samples: 2   # 採用する最小サンプル数/ビン
  # 2026-09-18 段2.5（低速の惰行カーブを実測に合わせる。ProblemReport_20260916）: 惰行カーブの
  # 低速端（creep_speed_kmh〜coast_curve_low_max_kmh）を細ビンで同定し直す（本番の 10km/h 幅
  # だと 5〜10km/h が 1 ビンに潰れていた）
  coast_curve_low_bin_kmh: 1.0          # 低速側のビン幅 [km/h]
  coast_curve_low_max_kmh: 15.0         # ここまで細ビン。以上は本番と同じ 10 km/h 幅
  coast_curve_low_min_bin_samples: 5    # 低速ビンの最少サンプル数
  # コーストダウンの終了判定（段7c。pattern_loop の _advance_coast）に使う許容幅
  grid_settle_tol_kmh: 1.0              # 「落ち着いた」とみなす車速の許容幅 [km/h]
  # 2026-10-20 段4-3: 手順2 の 2-3（学習用パターン＝FEL の補正表の学習走行）を走るか。
  # true は今までと同じ（2-3 を走る）。false なら 2-3 を走らず手順2 は 2-2 まで（約 43 → 32 分）。
  # ユーザー決定 2026-10-20: 段4-3 で手順2 を走り直すときだけ、yaml のコピーで false にする
  # （補正表 fel.enabled は false で保留中。手順12 の学習用パターンは別に走れる）
  fel_pattern_enabled: true
  # 2026-10-20 段4-3: 発進・停止側の表（と動き出す開度の測定）の開度の元。cmd ＝ 最終指令（0ee7c1b の
  # 作り方）、actual ＝ 実開度（0ee7c1b より前）。机上（既存 12 本のログの外れ r）で cmd は発進側が
  # 少し悪化（−0.20 → −0.26 km/h/s）。効く先: 手順2 の発進・停止側の表。pkl meta
  # side_table_opening_source に残る。決める時期: 戻しの層・アクセルの戻し量を切り分けた実機比較の後
  side_table_opening_source: actual
  # 2026-10-22 段5-3: 発進側の表のアクセル側の作り方。extrapolate ＝ 今まで（クリープ ＋ 本体の増えの
  # 外挿）、measured ＝ 手順2 の行を 2% のマスで測った点（帯の下端 2.5 km/h 以上の行）／max(クリープ,
  # 本体)（帯の上端 2.5 km/h 以下の行）。マス幅 2%・0.5 秒・2.5 km/h は仮値。既定は今と同じ。
  # 効く先: 手順2 の発進側の表（meta launch_accel_side_source）。決める時期: 段5-3 の机上の後の実機 1 組
  launch_accel_side_source: measured
  # 2026-10-22 段5-3: 発進側・停止側の表を作るときの加速度の窓 [s]（本体は 1.0）。既定 0.5 ＝ 今まで。
  # 仮値。効く先: 手順2 の発進側・停止側の表と動き出す開度の行の読み方。決める時期: 段5-3 の机上の後
  side_table_accel_window_s: 1.0
  # 2026-10-22 段5-4 b: 発進側の表を停止側と同じ車速の行（7.5 km/h 未満）まで置き換えるか。false は
  # 今まで（発進側は 0〜5 km/h だけ。5〜7.5 km/h の開度 0 が 発進側 −0.44 ↔ 停止側 0.00）。true は
  # 停止側の u ≦ 0 の値を写し、アクセル側は launch_accel_side_source で作る。効く先: 手順2 の発進側の表
  # （meta launch_rows_to_stop_max）。既定は今と同じ。決める時期: 段5-4 の机上の後の実機 1 組
  launch_rows_to_stop_max: false
  # 2026-10-22 段5-4 e: 発進側・停止側の表の行の代表車速。grid ＝ 今まで（行の中心）、data ＝ 置き換えた行の
  # 学習データ（動いている行）の車速の中央値（停止側の 5〜7.5 km/h の行はほぼ 5.00 km/h）。隣の行と
  # 0.5 km/h（仮値）より近い行は中心に戻す。効く先: 手順2 の発進側・停止側の表（meta
  # launch_speed_rep_map・stop_speed_rep_map）。既定は今と同じ。決める時期: 段5-4 の机上の後の実機 1 組
  side_row_speed_rep: grid
  # 2026-10-20 段4-3: 停止側の戻しの層を作るか。false は作らず pkl の stop_release_* が None
  # （0ee7c1b より前と同じ引き方）。机上で層を入れると外れの向きが逆になっただけ
  # （+0.6〜+1.0 → −0.5〜−1.3 km/h/s）。効く先: 手順2 の停止側の表。meta stop_release_layer_built は
  # 作ったときだけ残る。決める時期: アクセルの戻し量だけで作り直した実機比較の後
  stop_release_layer_enabled: false
  # 2026-10-20 段4-3: アクセルの戻し量（直近の u の最大 − 今）を手順2 のニューラルネットのアクセル側の
  # 3 つ目の入力にし、アクセルの戻しの表も作るか。false は入力が (車速, u) の 2 つ・表なしで、
  # pkl の accel_release_* が None（0ee7c1b より前と同じ）。実機 091838（2026-10-20）で true の pkl は
  # |偏差|>1 が 3.7 → 45.1 秒に悪化（DOB が戻しによる弱さを外乱として打ち消していたのを、表が説明
  # してしまい消えた）。効く先: 手順2 の C8 系の表。meta accel_release_input_enabled に残る。
  # 決める時期: 戻しの層と切り分けた実機比較の後
  accel_release_input_enabled: false
  # 2026-10-23 段5-7b: アクセルの踏み増し量（今の u − 直近 3 秒の u の最小）を手順2 のニューラルネットの
  # アクセル側の最後の入力にし（戻し量が on なら 4、off なら 3 入力）、アクセルの踏み増しの表も作るか。
  # false は入力・表とも今までと完全に同じ（pkl の accel_push_* が None）。根拠は机上（5-7a の pkl）:
  # 7.5 km/h 以上で戻していないアクセルの行は、踏み増し量が大きいほど実測が表より強い
  # （0〜0.3%: −0.10、8% 超: +0.08 km/h/s）。効く先: 手順2 の C8 系の表・計画・予測。
  # meta accel_push_input_enabled に残る。決める時期: 5-7a の実機比較の後
  accel_push_input_enabled: false
  # 2026-10-23 段5-8: 停止前の戻し B-1（手順2）。true なら各 G ランプの下りで、実車速が
  # stop_release_start_kmh を切ったら、ブレーキを山（直近 3 秒の最深。min からの量）の
  # stop_release_fracs 倍だけ（段ごとに交互）stop_release_rate_pct_s で直線に戻し、そのまま停車まで
  # 保つ。戻しても減速が止まったら（加速度 >= 0 が stop_release_escape_s 続く）停車保持へ踏む。
  # 目標減速度が stop_release_max_g を超える強い段には入れない。phase は RAMP_STOP_RELEASE。
  # false は今と同じ走り。根拠: モードの B5 は約 74 秒あるのに手順2 の学習データは 5.3 秒
  # （start 7.5・fracs・rate 2.0 は半分データ由来、escape 0.5・max_g 0.2 は仮値）。
  # 効く先: 手順2 の所要が約 +10 秒。決める時期: 段5-8 の実機 1 回の後
  stop_release_enabled: false
  stop_release_start_kmh: 7.5
  stop_release_fracs: [0.25, 0.5]
  stop_release_rate_pct_s: 2.0
  stop_release_escape_s: 0.5
  stop_release_max_g: 0.2
  # 2026-10-23 段5-8: 停車まぎわ除外の外し方。depth ＝ 5 km/h 未満かつ u <= −8% の行（今まで）、
  # window ＝ 加速度の窓が停車の瞬間にかかる行だけ。効く先: 手順2 の C8 系の表（meta
  # stop_approach_exclusion）。決める時期: 机上（stop_exclusion.py）の後
  stop_approach_exclusion: depth

# ── ペダル探索（手順 2-0。クリープ車速と停車保持開度を測る） ────────
#   両ペダルを vehicle.min_*_opening_pct（待機位置）に置き、クリープ車速が落ち着くのを待つ。
#   次にブレーキを min から brake_step_mm ずつ踏み、平均車速が停車しきい値未満になった位置を
#   停止確認開度とし、停止確認開度 + stop_hold_margin_pct で停車保持する。
#   2026-10-08 段2l-6（ProblemReport_20261001）: 不感帯の探索（アクセル・ブレーキの反応判定）は
#   やめた。onset_delta_kmh・onset_confirm_kmh・confirm_count・accel_max_pct・deadband_max_pct を削除し、
#   search_step_mm を brake_step_mm に改名した。
#   2026-10-09: brake_max_pct を削除。上限は vehicle.max_brake_opening_pct を使う
pedal_search:
  step_mm: 0.5                    # 停車保持位置への刻み送りの1刻み [mm]（走行前チェックも共通）
  dwell_s: 1.0                    # 1 刻みごとの待ち（この間の平均車速で判定。走行前チェックも共通）[s]
  onset_margin_kmh: 0.3           # ブレーキの「減速中は踏み増さない」判定・停止確認の余白 [km/h]
  # 2026-10-19 段2s-2 短縮: creep_window_s 10 → 7、creep_settle_min_s 10 → 7。机上（075823 の定速の保持を
  # 5 秒で切った CSV で作り直した表）で表はほぼ不変（|r| +0.002）。効く先: クリープの待ち時間。
  # 決める時期: 2s-3 の実機で確定の時刻が早すぎ（漸近の途中）ないかを見て戻す
  creep_window_s: 7.0             # クリープ安定: 平均車速の窓 [s]
  creep_settle_kmhs: 0.020        # クリープ安定: 窓平均の傾きがこれ未満 [km/h/s]（旧 0.1km/h÷3s と等価）
  creep_settle_min_s: 7.0         # クリープ安定: これだけ経つまで確定しない [s]（漸近の途中で止まらないため）
  creep_min_speed_kmh: 1.0        # クリープ安定: 平均車速がこれ以上 [km/h]
  creep_timeout_s: 90.0          # クリープ安定待ちの上限 [s]
  stop_hold_margin_pct: 10.0      # 停車保持 = 停止確認開度 + この値 [%]
  stop_confirm_max_wait_s: 10.0   # 走行前チェック（手順3以降）で停止確認開度まで踏んだ後、停車を待つ上限 [s]
  # 2-0 のブレーキを min から踏む1刻み [mm]（旧 search_step_mm）。停車保持への刻み送り（step_mm）とは
  # 分け、停止確認だけ細かく踏む。位置指令は0.01mm単位（PCON-CBのPCMD）なので 0.01mm = 1 pulse が下限
  brake_step_mm: 0.1

# ── 走行後の緩減速（手順 2 のパターン走行の後。停車保持まで） ────────────
#   ブレーキの min − approach_margin_pct までは最高速度で動かし（減速は出ない）、そこから
#   step_mm 踏む → dwell_s 待つ → 直近 slope_window_s の車速の傾きで減速度を判定する。
#   目標 − margin 未満なら 1 刻み踏み増し、release_above_g を超えたときだけ 1 刻み戻す。
#   踏み増しの上限は feedforward.stop_brake_offset_pct（停車保持開度＝ブレーキ min ＋ この量）。
decel_stop:
  target_decel_g: 0.2             # 目標減速度 [G]
  press_margin_g: 0.02            # 目標 − これ 未満なら踏み増す [G]
  release_above_g: 0.3            # これを超えたときだけ 1 刻み戻す [G]（vehicle.max_decel_g 以下）
  step_mm: 0.5                    # 1 刻みの移動量 [mm]（0.5mm ≈ 0.53%）
  dwell_s: 1.0                    # 1 刻みごとの待ち [s]（ブレーキ→減速の遅れ 0.3〜1.0s より長く）
  slope_window_s: 1.0             # 減速度を出す車速の傾きの窓 [s]
  approach_margin_pct: 1.0        # ブレーキの min の何 % 手前まで最高速度で動かすか [%]
  timeout_s: 60.0                 # これを超えても停車しなければエラー [s]

# ── KPI（product-requirements.md のプライマリーKPI。合否判定に使う） ──
kpi:
  max_abs_deviation_kmh: 1.0      # 最大逸脱（例外なし）[km/h]
  p95_deviation_kmh: 0.4          # 偏差 p95 [km/h]
  reversal_band_kmh: 0.3          # 符号反転を数える偏差の振幅しきい値 [km/h]
  reversal_window_s: 5.0          # 反転回数を数える窓 [s]
  reversal_limit_per_window: 1.0  # 窓あたりの反転回数上限
  # ペダル操作の滑らかさ: アクセル指令の往復回数（ProblemReport_20260921 手順3）
  pedal_reversal_hyst_pct: 0.1          # 山（谷）からこれ以上戻ったら 1 回と数える [%]
  pedal_reversal_limit_per_s: 0.4       # 全体の上限 [回/s]
  pedal_reversal_window_s: 60.0         # 局所を見る窓 [s]
  pedal_reversal_window_limit_per_s: 1.0  # 窓ごとの最大の上限 [回/s]
  pedal_reversal_min_window_s: 15.0     # 対象（ACCEL・基準5km/h以上）が これ未満の窓は除く [s]
  # 同時踏み: アクセル・ブレーキの実開度が両方とも 待機位置 ＋ この値 を超えた行（ProblemReport_20261001 段2o-3）
  pedal_overlap_margin_pct: 0.0          # 0 = 待機位置を少しでも両方超えたら数える [%]

# ── 手順 1（初期化）と走行前チェックの実施項目（false でスキップ） ─────────
#   false にした項目は実行も判定もせず [SKIP] と表示する。安全装置を外すことになるので注意。
checks:
  # 手順 1（初期化）。接続は全操作の前提のため切替対象外（常に実行）
  init_servo_comm: true        # Modbus 操作権(PMSL)有効化＋現在位置読み出し（false だと実機で指令が効かない恐れ）
  init_clear_errors: true      # アラームリセット＋残留確認
  init_servo_on: true          # サーボON（false だとアクチュエータが動かない）
  init_can: true               # CAN 通信チェック（車速読み出し）
  init_ups: false              # UPS 通信チェック（NUT 監視開始＋残量 >= 20%）。false なら UPS を監視しない
  init_home_return: true       # 原点復帰＋位置確認（false だと開度 0% の基準が保証されない。危険）
  # 走行前チェック（踏込前・踏込後の両方に効く）
  pre_communication: true      # 通信確認
  pre_servo_state: true        # サーボ状態（アラーム）
  pre_profile: true            # プロファイル
  pre_ups: false               # UPS残量（init_ups: false のときは true にできない）
  pre_actuator_position: true  # アクチュエータ位置（踏込前のみ）
  pre_brake_stop: true         # ブレーキを踏んで停止確認（false だと踏まずに現在位置で続行。危険）
  pre_vehicle_stopped: true    # 車速確認 0 km/h（踏込後のみ）

# ── 出力 ─────────────────────────────────────────────────────────────
output:
  results_dir: tests/research/results   # CSV・図・レポートの保存先
  csv_interval_s: 0.05                  # CSV のサンプリング間隔 [s]（段1b: control.log_interval_ms と合わせて 50ms に）
  plot: true                            # matplotlib で図を出すか
  print_interval_s: 1.0                 # ターミナルへの進捗 print 間隔 [s]

# ── 参照する本番設定 ─────────────────────────────────────────────────
hardware:
  settings_path: config/settings.toml   # シリアル/CAN/GPIO 設定（本番と共通）
  database_url: postgresql://localhost/driving_robot  # モード・ログ参照先
